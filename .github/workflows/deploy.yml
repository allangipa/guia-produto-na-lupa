name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Preço da Amazon só pode ficar no ar com consulta recente: republica todo
  # dia às 06:00 UTC (03:00 em Brasília). Sem credenciais, a etapa é no-op e o
  # deploy diário só reconstrói o mesmo site.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sincroniza foto, preço e link dos produtos pela Creators API. Enquanto
      # os dois secrets não existirem, o script apenas avisa e sai com 0.
      - run: node scripts/amazon-sync.mjs
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: ${{ vars.NEXT_PUBLIC_AMAZON_TAG }}

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_AMAZON_TAG: ${{ vars.NEXT_PUBLIC_AMAZON_TAG }}

      # Sem este arquivo o GitHub Pages ignora a pasta _next e o site sobe sem CSS.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
